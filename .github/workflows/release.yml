name: Build and Release Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Module Zip
        run: |
          zip -r "Oppo_Messages_Enabler_${GITHUB_REF_NAME}.zip" \
            META-INF \
            app_v2.xml \
            customize.sh \
            feature_rsa4.0_t3_default_app.xml \
            module.prop \
            post-fs-data.sh \
            service.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Oppo_Messages_Enabler_${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
